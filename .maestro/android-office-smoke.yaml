appId: pt.andrevazao.vazaosovereigntrader
---
- launchApp
- waitForAnimationToEnd
# Kivy canvas labels are not exposed consistently to Android accessibility.
# The first-run chooser is vertically stacked; use a viewport-relative tap
# on the virtual-office CTA, then let the shell OCR assert the resulting page.
- tapOn:
    point: "50%, 62%"
- waitForAnimationToEnd
- takeScreenshot: vst-android-office
