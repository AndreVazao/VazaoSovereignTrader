name: Windows EXE
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "PC_ENGINE/**"
      - "scripts/**"
      - "installer/**"
      - "tests/**"
      - "requirements-pc.txt"
      - ".github/workflows/windows-exe.yml"
  push:
    tags:
      - "pc-v*"
concurrency:
  group: windows-exe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          foreach ($scriptPath in @(
            "scripts/android_emulator_headless.ps1",
            "scripts/android_phone_mirror.ps1",
            "scripts/vst_local_backend_audit.ps1",
            "scripts/setup_windows.ps1",
            "scripts/ensure_windows_token.ps1",
            "scripts/install_windows_autostart.ps1",
            "scripts/verify_pc_install.ps1",
            "scripts/verify_public_market_data.ps1",
            "scripts/configure_windows_secrets.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw ("PowerShell parse errors in ${scriptPath}: " + ($parseErrors | Format-List | Out-String))
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pc.txt
          pip install pyinstaller
      - name: Validate adaptive resource sampling on Windows
        shell: pwsh
        run: |
          python -c "from PC_ENGINE.core.adaptive_resource_manager import detect_system_resources; s = detect_system_resources(); assert s.cpu_count >= 1, 'CPU count unavailable'; assert s.memory_total_mb > 0, 'Total RAM unavailable'; assert s.memory_available_mb > 0, 'Available RAM unavailable'; assert s.disk_free_mb > 0, 'Free disk unavailable'; print(f'Windows resource snapshot: CPU={s.cpu_count}, RAM={s.memory_total_mb}MB, available={s.memory_available_mb}MB, disk_free={s.disk_free_mb}MB, load={s.cpu_load_pct}')"
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name VazaoSovereignTrader --paths . PC_ENGINE/main.py
      - name: EXE smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-runtime | Out-Null
          New-Item -ItemType Directory -Force dist\config | Out-Null
          Copy-Item PC_ENGINE\config\config.example.json dist\config\config.example.json
          $configPath = (Resolve-Path dist\config\config.example.json)
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.radar.enabled = $false
          $config.shared_intelligence.enabled = $false
          $config.research.enabled = $false
          $config.confluence.enabled = $false
          $config | ConvertTo-Json -Depth 30 | Set-Content $configPath -Encoding utf8
          $proc = Start-Process -FilePath dist\VazaoSovereignTrader.exe -WorkingDirectory (Resolve-Path test-runtime) -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($proc.HasExited) { throw "EXE exited before health check (exit code $($proc.ExitCode))" }
            $ready = $false
            $healthLog = @()
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/health -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { $healthLog += $_.Exception.Message }
            }
            if (-not $ready) { throw "EXE health endpoint did not become ready. Recent request errors: $($healthLog -join ' | ')" }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\VazaoSovereignTrader.exe release\
          New-Item -ItemType Directory -Force release\config | Out-Null
          Copy-Item PC_ENGINE\config\config.example.json release\config\
          Copy-Item README.md release\
          Copy-Item scripts\windows_run_paper_dashboard.bat release\
          Compress-Archive -Path release\* -DestinationPath VazaoSovereignTrader-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vazaosovereigntrader-windows
          path: VazaoSovereignTrader-Windows.zip
          if-no-files-found: error

  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build previous-version installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 -AppVersion "2026.10.1"
          $old = Join-Path $env:GITHUB_WORKSPACE "installer-output\VazaoSovereignTrader-Setup-2026.10.1.exe"
          if (-not (Test-Path $old)) { throw "Previous-version installer was not produced." }
          Copy-Item $old (Join-Path $env:RUNNER_TEMP "VST-Installer-Old.exe") -Force
      - name: Build upgrade installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1 -AppVersion "2026.11.1"
          $new = Join-Path $env:GITHUB_WORKSPACE "installer-output\VazaoSovereignTrader-Setup-2026.11.1.exe"
          if (-not (Test-Path $new)) { throw "Upgrade installer was not produced." }
      - name: Install, upgrade, launch, health, uninstall and vault preservation smoke test
        shell: pwsh
        run: |
          $oldInstaller = Join-Path $env:RUNNER_TEMP "VST-Installer-Old.exe"
          $newInstaller = Join-Path $env:GITHUB_WORKSPACE "installer-output\VazaoSovereignTrader-Setup-2026.11.1.exe"
          foreach ($path in @($oldInstaller, $newInstaller)) {
            if (-not (Test-Path $path)) { throw "Required installer missing: $path" }
            Write-Host "$([System.IO.Path]::GetFileName($path)) SHA256: $((Get-FileHash $path -Algorithm SHA256).Hash)"
          }

          $testDir = Join-Path $env:RUNNER_TEMP "VST-Installer-Smoke"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }

          # Seed the durable per-user vault before v1 installation. Neither
          # installation, in-place version upgrade nor uninstall may alter it.
          $vaultRoot = Join-Path (Join-Path $env:LOCALAPPDATA "VazaoSovereignTraderData") "vault"
          $vaultLearning = Join-Path $vaultRoot "learning"
          New-Item -ItemType Directory -Force $vaultLearning | Out-Null
          $vaultMarker = Join-Path $vaultLearning "installer-upgrade-preservation-smoke.bin"
          $vaultBytes = [System.Text.Encoding]::UTF8.GetBytes("VST vault upgrade preservation $(Get-Date -Format o)")
          [System.IO.File]::WriteAllBytes($vaultMarker, $vaultBytes)
          $expectedHash = (Get-FileHash $vaultMarker -Algorithm SHA256).Hash

          $installArgs = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$testDir"
          $firstInstall = Start-Process -FilePath $oldInstaller -ArgumentList $installArgs -Wait -PassThru
          if ($firstInstall.ExitCode -ne 0) { throw "Previous-version silent install failed: $($firstInstall.ExitCode)." }
          if (-not (Test-Path (Join-Path $testDir "VazaoSovereignTrader.exe"))) {
            throw "Previous-version engine was not installed."
          }
          if (-not (Test-Path $vaultMarker)) { throw "Initial install removed the existing learning vault." }

          # Install a newer AppVersion with the same stable AppId and path.
          $upgrade = Start-Process -FilePath $newInstaller -ArgumentList $installArgs -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place version upgrade failed: $($upgrade.ExitCode)." }

          $engine = Join-Path $testDir "VazaoSovereignTrader.exe"
          $configPath = Join-Path $testDir "config\config.local.json"
          $uninstaller = Join-Path $testDir "unins000.exe"
          if (-not (Test-Path $engine)) { throw "Upgraded engine EXE missing." }
          if (-not (Test-Path $configPath)) { throw "Upgraded local config missing." }
          if (-not (Test-Path $uninstaller)) { throw "Upgraded uninstaller missing." }
          if ((Get-FileHash $vaultMarker -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Learning vault changed during in-place version upgrade."
          }
          foreach ($taskName in @("VazaoSovereignTrader", "VazaoSovereignTrader-MarketData")) {
            if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
              throw "Installer unexpectedly created an unattended scheduled task: $taskName"
            }
          }
          $autoStarted = Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq "VazaoSovereignTrader.exe" -and $_.ExecutablePath -and $_.ExecutablePath -ieq (Join-Path $testDir "VazaoSovereignTrader.exe")
          }
          if ($autoStarted) { throw "Installer unexpectedly launched the engine before operator validation." }

          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.mode = "PAPER"
          $config.server.host = "127.0.0.1"
          $config.server.port = 18765
          $config.radar.enabled = $false
          $config.shared_intelligence.enabled = $false
          $config.research.enabled = $false
          $config.confluence.enabled = $false
          $config.fast_path.enabled = $false
          $config.fast_path.allow_real = $false
          $config.autonomous_execution.allow_real = $false
          $config.autonomous_execution.auto_promote_real = $false
          $config | ConvertTo-Json -Depth 50 | Set-Content $configPath -Encoding utf8

          function Stop-SmokeEngineProcesses {
            $imageName = [System.IO.Path]::GetFileName($engine)
            $running = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq $imageName -and $_.ExecutablePath -and $_.ExecutablePath -ieq $engine
            }
            foreach ($item in $running) {
              Stop-Process -Id $item.ProcessId -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 2
            $remaining = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq $imageName -and $_.ExecutablePath -and $_.ExecutablePath -ieq $engine
            }
            if ($remaining) { throw "Installed engine process tree did not stop before uninstall." }
          }

          $proc = $null
          try {
            $proc = Start-Process -FilePath $engine -WorkingDirectory $testDir -PassThru -WindowStyle Hidden
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "Upgraded EXE exited before health check (exit code $($proc.ExitCode))." }
              try {
                $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18765/health -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "Upgraded EXE health endpoint did not become ready." }
          } finally {
            if ($proc) {
              $proc.Refresh()
              if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
            Stop-SmokeEngineProcesses
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed: $($uninstall.ExitCode)." }
          if (Test-Path $engine) { throw "Engine EXE remained after uninstall." }
          foreach ($taskName in @("VazaoSovereignTrader", "VazaoSovereignTrader-MarketData")) {
            if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
              throw "Scheduled task remained after uninstall: $taskName"
            }
          }
          if (-not (Test-Path $vaultMarker)) { throw "Learning vault was deleted by uninstall." }
          if ((Get-FileHash $vaultMarker -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Learning vault bytes changed during uninstall."
          }
          Write-Host "v1 install -> v2 in-place upgrade -> PAPER health -> uninstall -> vault SHA256 preservation passed."
      - uses: actions/upload-artifact@v4
        with:
          name: vazaosovereigntrader-windows-installer
          path: installer-output/VazaoSovereignTrader-Setup-2026.11.1.exe
          if-no-files-found: error
