name: Shared Learning Service
on:
  pull_request:
    paths:
      - "cloud/shared-learning/**"
      - ".github/workflows/shared-learning-service.yml"
  push:
    branches: [main]
    paths:
      - "cloud/shared-learning/**"
      - ".github/workflows/shared-learning-service.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-learning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/shared-learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/shared-learning/package.json
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
  postgres-schema-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shared_learning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal Supabase auth and role shim
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d shared_learning_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
      - name: Apply all migrations to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in cloud/shared-learning/supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d shared_learning_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify RLS, grants, visibility defaults and signing-key trigger
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d shared_learning_test -v ON_ERROR_STOP=1 -f cloud/shared-learning/supabase/tests/verified_publication_schema_smoke.sql
