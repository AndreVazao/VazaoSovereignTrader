name: Android Emulator UI Smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "MOBILE_APP/**"
      - ".maestro/**"
      - ".github/workflows/android-emulator-maestro.yml"

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run mobile contract tests
        run: python -m unittest MOBILE_APP.test_startup_contract MOBILE_APP.test_endpoint_selection -v

      - name: Compile mobile Python sources
        run: python -m compileall -q MOBILE_APP

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip libffi-dev libssl-dev autoconf automake libtool libtool-bin libltdl-dev pkg-config tesseract-ocr

      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "Cython==0.29.36"

      - name: Build emulator-compatible debug APK
        working-directory: MOBILE_APP
        run: |
          # The release APK workflow targets arm64 devices. This smoke-test APK
          # targets the hosted x86_64 emulator and is not published as a release artifact.
          sed -i 's/^android.archs = .*/android.archs = x86_64/' buildozer.spec
          yes | buildozer android debug
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

      - name: Enable KVM for the hosted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Launch Android emulator and smoke-test the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/.github/scripts/android-emulator-smoke.sh"

      - name: Upload Android UI smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vst-android-emulator-smoke
          path: test-artifacts/android/
          if-no-files-found: warn
