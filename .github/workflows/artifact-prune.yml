name: Actions artifact prune

on:
  workflow_dispatch:
  schedule:
    # Low-frequency maintenance: keep the repository lean without burning CI minutes.
    - cron: "17 4 1 * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: artifact-prune
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep only the five newest artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            artifacts.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );

            const keep = artifacts.slice(0, 5);
            const keepIds = new Set(keep.map(a => a.id));
            const remove = artifacts.filter(a => !keepIds.has(a.id));

            core.info(`Found ${artifacts.length} artifacts; keeping ${keep.length}, deleting ${remove.length}.`);

            for (const artifact of remove) {
              core.info(`Deleting ${artifact.name} (#${artifact.id}) created ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            core.info("Artifact prune complete.");
