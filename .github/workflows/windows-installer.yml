name: Windows One-Click Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - "scripts/build_windows_installer.ps1"
      - "PC_ENGINE/**"
      - "requirements-pc.txt"
      - "docs/WINDOWS_ONE_CLICK_INSTALL.md"
  push:
    branches:
      - main
    tags:
      - "pc-v*"

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build one-click installer
        shell: pwsh
        run: |
          .\scripts\build_windows_installer.ps1

      - name: Installer smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\installer-output" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Host "Installer directory contents:"
            Get-ChildItem -Path installer -Recurse -Force | Select-Object FullName,Length
            throw "Installer artifact was not produced."
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Installer: $($installer.Name)"
          Write-Host "SHA256: $hash"

          $smoke = Join-Path $env:RUNNER_TEMP "VazaoSovereignTrader-Smoke"
          if (Test-Path $smoke) { Remove-Item $smoke -Recurse -Force }
          & $installer.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="$smoke"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with exit code $LASTEXITCODE." }

          foreach ($required in @(
              "$smoke\VazaoSovereignTrader.exe",
              "$smoke\VazaoSovereignTrader-MarketData.exe",
              "$smoke\config\config.local.json",
              "$smoke\data\operator_exchange\INBOX",
              "$smoke\data\operator_exchange\OUTBOX"
          )) {
              if (-not (Test-Path $required)) { throw "Installer did not create required path: $required" }
          }

          $proc = Start-Process -FilePath "$smoke\VazaoSovereignTrader.exe" -WorkingDirectory $smoke -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited -and $proc.ExitCode -ne 0) {
              throw "Installed engine exited during smoke test (exit code $($proc.ExitCode))."
          }
          if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
          }

          $uninstaller = Join-Path $smoke "unins000.exe"
          if (Test-Path $uninstaller) {
              & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vazaosovereigntrader-windows-installer
          path: installer/**/VazaoSovereignTrader-Setup-*.exe
          if-no-files-found: error
