name: Connector sandbox Linux
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "PC_ENGINE/core/connector_worker_sandbox.py"
      - "PC_ENGINE/core/connector_runtime_manifest.py"
      - "tests/test_connector_worker_sandbox.py"
      - "tests/test_connector_runtime_manifest.py"
      - "docs/CONNECTOR_WORKER_SANDBOX_PLAN.md"
      - ".github/workflows/connector-sandbox-linux.yml"

permissions:
  contents: read

concurrency:
  group: connector-sandbox-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bubblewrap-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap gcc
          bwrap --version

      - name: Install project test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-pc.txt pytest

      - name: Execute Linux sandbox enforcement tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          VST_RUN_BWRAP_INTEGRATION: "1"
        run: python -m pytest -q tests/test_connector_worker_sandbox.py tests/test_connector_runtime_manifest.py
