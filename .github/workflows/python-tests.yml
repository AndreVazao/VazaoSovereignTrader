name: Python tests

on:
  workflow_dispatch:
  push:
    branches: [main, 'refactor/**', 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-pc.txt pytest
      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q tests
