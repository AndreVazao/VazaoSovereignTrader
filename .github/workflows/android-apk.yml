name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-v*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk libffi-dev libssl-dev
      - name: Install Buildozer
        run: pip install --upgrade buildozer cython
      - name: Build debug APK
        working-directory: MOBILE_APP
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vazaosovereigntrader-android
          path: MOBILE_APP/bin/*.apk
          if-no-files-found: error
