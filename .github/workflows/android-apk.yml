name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "MOBILE_APP/**"
      - ".github/workflows/android-apk.yml"
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run endpoint-selection unit tests
        run: python -m unittest MOBILE_APP.test_endpoint_selection -v
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip libffi-dev libssl-dev autoconf automake libtool libtool-bin libltdl-dev pkg-config
      - name: Verify Java runtime
        run: |
          java -version
          test "$(java -version 2>&1 | head -n 1 | grep -o '"[0-9]*' | tr -d '"')" = "17"
      - name: Install Buildozer
        run: pip install "buildozer==1.5.0" "Cython==0.29.36"
      - name: Build debug APK
        working-directory: MOBILE_APP
        run: yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vazaosovereigntrader-android
          path: MOBILE_APP/bin/*.apk
          if-no-files-found: error
